<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">Visual Design Kit: one library, independent projects</title><desc id="desc">A shared library supports existing and new brand projects. Each project keeps its assets and decisions. Sanitized lessons return through review.</desc><!-- Version-Timestamp: 2026-09-14T15:19:22.465999-04:00 --><rect width="1200" height="550" fill="#f5f3ec"/><text x="60" y="62" font-family="Arial,sans-serif" font-size="14" letter-spacing="3" fill="#315e52">RESEARCH / DIRECTION / PRODUCTION / LEARNING</text><text x="60" y="127" font-family="Georgia,serif" font-size="54" fill="#183d32">Visual Design Kit</text><text x="60" y="164" font-family="Arial,sans-serif" font-size="19" fill="#38594f">One shared method. Separate brands. Deliberate design decisions.</text><rect x="60" y="215" width="330" height="210" rx="12" fill="#183d32"/><text x="85" y="259" font-family="Arial,sans-serif" font-size="25" fill="white">Shared library</text><g font-family="Arial,sans-serif" font-size="18" fill="#e0ebe4"><text x="85" y="300">130 reference capabilities</text><text x="85" y="332">One project starting skill</text><text x="85" y="364">Templates and quality checks</text><text x="85" y="396">Versioned, reviewed updates</text></g><path d="M400 310 H470 M455 298 L470 310 L455 322" fill="none" stroke="#315e52" stroke-width="3"/><rect x="495" y="215" width="305" height="210" rx="12" fill="white" stroke="#b9c9bf"/><rect x="825" y="215" width="315" height="210" rx="12" fill="white" stroke="#b9c9bf"/><g font-family="Arial,sans-serif" fill="#183d32"><text x="519" y="259" font-size="23">Existing brand project</text><text x="849" y="259" font-size="23">New brand project</text><g font-size="17"><text x="519" y="305">Preserve approved identity</text><text x="519" y="338">Extend the visual language</text><text x="519" y="371">Produce the chosen deliverable</text><text x="849" y="305">Research and positioning</text><text x="849" y="338">Explore identity directions</text><text x="849" y="371">Build and apply the system</text></g></g><path d="M980 443 V475 H228 V443 M218 456 L228 443 L238 456" fill="none" stroke="#315e52" stroke-width="2"/><rect x="435" y="457" width="405" height="34" fill="#f5f3ec"/><text x="450" y="480" font-family="Arial,sans-serif" font-size="17" fill="#315e52">Sanitized lessons → review → versioned improvement</text><text x="60" y="526" font-family="Arial,sans-serif" font-size="14" fill="#38594f">Client assets, private evidence and approvals stay inside their own project.</text></svg>