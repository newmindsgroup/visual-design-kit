# Visual Design Kit continuous integration
# Version-Timestamp: 2026-10-27 12:21:23 AST
# Third-party actions are pinned to major versions from GitHub's official `actions/` org.
# For stricter supply-chain control, pin them to full commit SHAs.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Repository tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
      - name: Library tests
        working-directory: plugins/visual-design-studio/library
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
      - name: Packaging rules
        run: python tools/validate_plugin.py
      - name: Optional toolkit integrity and host parity
        run: python tools/build_toolkits.py --check
      - name: Claude skill mirror matches .agents/skills
        run: python tools/sync_agent_skills.py
      - name: Codex parity (manifest, versions, skills, agent fallback, mirror)
        run: python tools/check_codex_parity.py
      - name: Atlas complete and index current
        run: |
          python plugins/visual-design-studio/library/scripts/atlas.py validate --complete
          cp plugins/visual-design-studio/library/atlas/index.json /tmp/index.json
          python plugins/visual-design-studio/library/scripts/atlas.py build
          diff -u /tmp/index.json plugins/visual-design-studio/library/atlas/index.json
      - name: Tokens lint and dist current
        working-directory: plugins/visual-design-studio/library
        run: |
          python scripts/tokens.py lint
          python scripts/tokens.py check
      - name: Payload integrity matches committed metadata
        run: |
          VERSION=$(python -c "import json;print(json.load(open('plugins/visual-design-studio/.claude-plugin/plugin.json'))['version'])")
          STAMP=$(python -c "import json;print(json.load(open('plugins/visual-design-studio/library/PACKAGE-MANIFEST.json'))['Version-Timestamp'])")
          python tools/build_plugin.py --plugin-root plugins/visual-design-studio --source-root . --version "$VERSION" --timestamp "$STAMP" --check
          (cd plugins/visual-design-studio && sha256sum -c PAYLOAD.sha256 --quiet)

  native-template:
    name: BAMA native template build
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain and helper regressions
        run: |
          xcrun swift --version
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s extras/bama-mac-studio/tests -v
      - name: Fresh template build and core tests
        run: |
          python3 extras/bama-mac-studio/skills/bama-new-mac-app/scripts/scaffold.py ToolkitProbe com.example.toolkitprobe "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/ToolkitProbe"
          ./build.sh | tee "$RUNNER_TEMP/bama-template-build.log"
          swift test
          tools/icon_review.sh "$RUNNER_TEMP/toolkit-icon-contact-sheet.png"
          BAMA_BINARY=$(sed -n 's/^STAGED_BINARY=//p' "$RUNNER_TEMP/bama-template-build.log")
          python3 tools/run_checks.py selftest "$BAMA_BINARY" --timeout 90
      - name: Compile optional app CLI and MCP adapter
        run: |
          zsh extras/bama-mac-studio/skills/bama-agent-cli/scripts/add-agent-cli.sh "$RUNNER_TEMP/ToolkitProbe" toolkit-probe
          cd "$RUNNER_TEMP/ToolkitProbe"
          ./build.sh --no-icon

  claude-plugin:
    name: Claude plugin validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Claude Code CLI (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.304
      - name: Validate marketplace and plugins
        run: |
          claude plugin validate .
          claude plugin validate plugins/visual-design-studio
          claude plugin validate extras/astro-website-studio
          claude plugin validate extras/bama-mac-studio
          claude plugin validate extras/rea-toolkit

  examples:
    name: Example builds and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Astro motion examples
        working-directory: plugins/visual-design-studio/library/examples/astro-motion
        run: |
          npm ci
          npm audit --ignore-scripts
          npm test
          npm run build
      - name: Screen production player tests
        working-directory: plugins/visual-design-studio/library/examples/screen-production
        run: node --test player.test.mjs
      - name: Touch session tests
        working-directory: plugins/visual-design-studio/library/examples/media-quality-recipes/touch-session
        run: node --test session.test.mjs
      # Unit tests and type check only. No video renders in CI: Remotion is source-available
      # (see the example README and library/knowledge/ASSETS-LICENSES.md).
      - name: Remotion motion example (tests and type check, no renders)
        working-directory: plugins/visual-design-studio/library/examples/motion-remotion
        run: |
          npm ci
          npm audit --ignore-scripts
          npm test
          npx tsc --noEmit
      - name: Portable Lottie examples current
        run: python3 plugins/visual-design-studio/library/scripts/lottie_build.py examples --check
      - name: PPTX deck example
        working-directory: plugins/visual-design-studio/library/examples/deck-pptx
        run: |
          npm ci
          npm audit --ignore-scripts
          npm test

  react-system:
    name: React reference system
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/visual-design-studio/library/examples/react-system
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install (lockfile)
        run: npm ci
      - name: Audit locked dependencies
        run: npm audit --ignore-scripts
      - name: Token copies match library/tokens/dist
        run: node scripts/sync-tokens.mjs --check
      - name: Unit tests and type check
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser and axe checks in every brand, mode and direction
        run: |
          npm install --no-save playwright@1.48.2 axe-core@4.10.2
          npx playwright install --with-deps chromium
          PLAYWRIGHT_MODULE="$PWD/node_modules/playwright/index.js" AXE_SCRIPT="$PWD/node_modules/axe-core/axe.min.js" npm run test:browser
